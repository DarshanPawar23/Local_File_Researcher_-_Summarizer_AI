[project]
name = "local_file_researcher"
version = "0.1.0"
description = "local-file-researcher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.6.1"
]

[project.scripts]
local_file_researcher = "local_file_researcher.main:run"
run_crew = "local_file_researcher.main:run"
train = "local_file_researcher.main:train"
replay = "local_file_researcher.main:replay"
test = "local_file_researcher.main:test"
run_with_trigger = "local_file_researcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
